[package]
name = "markdown-x"
version = "2.8.0"
description = "A lightweight Markdown editor optimized for computational mechanics"
authors = ["you"]
edition = "2021"

[lib]
name = "markdown_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri's production marker. Without it the `dev` cfg is on, and the app loads `build.devUrl`
# (http://localhost:1420) INSTEAD of the frontend embedded in the binary - which is why a
# standalone APK showed "Failed to request http://localhost:1420/" on a phone that had no
# dev server. `tauri build` passes this automatically; a manual Android build must pass it
# explicitly:  cargo build --release --target aarch64-linux-android --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows only: list_system_fonts() enumerates families by reading the registry
# Fonts key, which has no equivalent on any other target.
[target.'cfg(windows)'.dependencies]
winreg = "0.5.0"

# Desktop only. The published plugin support matrix marks android/ios as
# unsupported for updater, process and single-instance (see MAINTENANCE §13.4),
# and `notify` backs the on-disk file watcher, which has nothing to watch on a
# phone: mobile has no workspace folder tree and the fs scope is the app sandbox.
#
# Explicit target_os lists are required here: Cargo resolves dependency tables
# with rustc's standard cfgs only, so `cfg(desktop)` - a cfg tauri-build injects
# later in the pipeline - would silently match nothing.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
notify = "6.1"
